name: Verify live GitHub Pages
on:
  push:
    branches: [gh-pages]
    paths: ['*.html', '*-manifest.json', 'deployment.json', '.github/workflows/check-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-live-kit-pages
  cancel-in-progress: true
jobs:
  verify-live-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify all live routes against the reviewed source build
        run: |
          python3 - <<'PY'
          import hashlib,json,os,time,urllib.request
          from pathlib import Path
          base='https://ray-math.github.io/tripfit/'
          source=json.loads(Path('deployment.json').read_text())['source_commit']
          routes={'':'gallery','index.html':'gallery','gallery.html':'gallery','lesson.html':'lesson','regenerated.html':'lesson','apps.html':'apps','cafe.html':'cafe','event.html':'event'}
          manifests={name:json.loads(Path(name+'-manifest.json').read_text()) for name in set(routes.values())}
          for manifest in manifests.values():
              assert 'connections.js' in manifest['modules'] and 'press-feedback.js' in manifest['modules']
          deadline=time.monotonic()+240;last=''
          while time.monotonic()<deadline:
              try:
                  def get(path):
                      req=urllib.request.Request(base+path+'?v='+source[:12],headers={'User-Agent':'TripFit-Pages-Verification/2.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=15) as response:
                          assert response.status==200,(path,response.status)
                          return response.read(),response.headers.get('Content-Type','')
                  provenance,_=get('deployment.json')
                  assert json.loads(provenance)['source_commit']==source,'Waiting for new provenance'
                  for path,name in routes.items():
                      data,kind=get(path)
                      assert 'text/html' in kind,(path,kind)
                      assert hashlib.sha256(data).hexdigest()==manifests[name]['output_sha256'],path+' output mismatch'
                      assert b'installPressFeedback' in data and b'declareConnection' in data
                      if name=='cafe': assert b'__cafe' in data and b'motion-diagnostics' in data
                      if name=='event': assert b'__event' in data and b'motion-diagnostics' in data
                  for name,expected in manifests.items():
                      payload,_=get(name+'-manifest.json')
                      assert json.loads(payload)['output_sha256']==expected['output_sha256']
                  result={'verified':True,'source_commit':source,'routes':[base+p for p in routes],'checks':'HTTP 200, HTML MIME, exact output SHA-256, shared connection/press modules, diagnostics'}
                  print(json.dumps(result,indent=2))
                  with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                      f.write('## Live UI kit verified\n\n'+json.dumps(result,indent=2)+'\n')
                  break
              except Exception as exc:
                  last=str(exc);print('Waiting for Pages:',last,flush=True);time.sleep(8)
          else:raise RuntimeError('Live verification failed: '+last)
          PY
