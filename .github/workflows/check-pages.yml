name: Verify live GitHub Pages
on:
  push:
    branches: [gh-pages]
    paths: ['*.html', '*-manifest.json', 'deployment.json', '.github/workflows/check-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-live-kit-pages
  cancel-in-progress: true
jobs:
  verify-live-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm live HTML and aliases match this verified build
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.request
          from pathlib import Path
          base = 'https://ray-math.github.io/tripfit/'
          expected_source = json.loads(Path('deployment.json').read_text())['source_commit']
          gallery_hash = json.loads(Path('gallery-manifest.json').read_text())['output_sha256']
          lesson_hash = json.loads(Path('lesson-manifest.json').read_text())['output_sha256']
          paths = ['', 'gallery.html', 'lesson.html', 'regenerated.html', 'deployment.json']
          deadline = time.monotonic() + 200
          last_error = ''
          while time.monotonic() < deadline:
              try:
                  results = {}
                  for path in paths:
                      request = urllib.request.Request(base + path + '?v=' + expected_source[:12], headers={'User-Agent':'TripFit-Pages-Verification/1.1', 'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request, timeout=15) as response:
                          assert response.status == 200, (path, response.status)
                          if path != 'deployment.json':
                              assert 'text/html' in response.headers.get('Content-Type',''), path
                          results[path] = response.read()
                  for path, expected_hash in [('',gallery_hash), ('gallery.html',gallery_hash), ('lesson.html',lesson_hash), ('regenerated.html',lesson_hash)]:
                      assert hashlib.sha256(results[path]).hexdigest() == expected_hash, 'Published bytes mismatch: ' + path
                  assert json.loads(results['deployment.json'])['source_commit'] == expected_source
                  assert b'__gallery' in results[''] and b'startLesson' in results['lesson.html']
                  assert b'--tk-island-width:88px' in results['lesson.html']
                  assert b'pop: makeSpring(320, 24' in results['lesson.html']
                  print(json.dumps({'verified':True,'source_commit':expected_source,'routes':[base+p for p in paths]}, indent=2))
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                      summary.write('## Live GitHub Pages verified\n\nGallery: '+base+'\n\nLesson: '+base+'lesson.html\n\nCompact island and gentler spring build verified by exact SHA-256.\n')
                  break
              except Exception as exc:
                  last_error = str(exc)
                  print('Waiting for Pages propagation:',last_error)
                  time.sleep(8)
          else:
              raise RuntimeError('Live GitHub Pages verification failed: '+last_error)
          PY
