name: Regenerated UI kit example
on:
  push:
    branches: [high]
    paths: ['ui-kit/**', '.github/workflows/ui-kit-regenerated.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing kit tests
        run: node --test ui-kit/tests/*.test.mjs
      - name: Install browser runners
        if: hashFiles('ui-kit/tests/regenerated.spec.py') != ''
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Build and test regenerated example
        if: hashFiles('ui-kit/tests/regenerated.spec.py') != ''
        run: |
          python ui-kit/build_preview.py
          python ui-kit/tests/regenerated.spec.py --browser chromium
          python ui-kit/tests/regenerated.spec.py --browser webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regenerated-ui-kit
          path: |
            ui-kit/
            .github/workflows/ui-kit-regenerated.yml
          retention-days: 7
