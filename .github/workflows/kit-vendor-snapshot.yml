name: UI kit vendor snapshot
on:
  push:
    branches: [high]
    paths: ['.github/workflows/kit-vendor-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch immutable upstream source snapshots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request,hashlib,json
          out=Path('vendor-snapshot');out.mkdir()
          items=[('tabbable','focus-trap/tabbable','52b066375035abc647d76a30b83baced42119bb4','src/index.js'),('tabbable-license','focus-trap/tabbable','52b066375035abc647d76a30b83baced42119bb4','LICENSE'),('qrcode','davidshimjs/qrcodejs','04f46c6a0708418cb7b96fc563eacae0fbf77674','qrcode.js'),('qrcode-license','davidshimjs/qrcodejs','04f46c6a0708418cb7b96fc563eacae0fbf77674','LICENSE'),('raf-schd','alexreardon/raf-schd','v4.0.3','src/index.js'),('raf-schd-license','alexreardon/raf-schd','v4.0.3','LICENSE')]
          manifest=[]
          for name,repo,ref,path in items:
            url=f'https://raw.githubusercontent.com/{repo}/{ref}/{path}'
            data=urllib.request.urlopen(url,timeout=25).read()
            fn=name+('.txt' if 'license' in name else '.js');(out/fn).write_bytes(data)
            manifest.append({'name':name,'repo':repo,'ref':ref,'path':path,'url':url,'sha256':hashlib.sha256(data).hexdigest()})
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kit-vendor-snapshot
          path: vendor-snapshot/
          retention-days: 7
