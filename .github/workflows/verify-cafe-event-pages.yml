name: Verify live cafe and event GitHub Pages
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/verify-cafe-event-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify app routes against this deployment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request,hashlib,json,time
          base='https://ray-math.github.io/tripfit/'
          source=json.loads(Path('deployment.json').read_text())['source_commit']
          cases={'apps.html':'apps','cafe.html':'cafe','event.html':'event'}
          expected={name:json.loads(Path(name+'-manifest.json').read_text())['output_sha256'] for name in cases.values()}
          deadline=time.monotonic()+230;last=''
          while time.monotonic()<deadline:
              try:
                  def get(path):
                      req=urllib.request.Request(base+path+'?v='+source[:12],headers={'Cache-Control':'no-cache','User-Agent':'TripFit-App-Verification/2.0'})
                      with urllib.request.urlopen(req,timeout=15) as r:
                          assert r.status==200
                          return r.read(),r.headers.get('Content-Type','')
                  payload,_=get('deployment.json');assert json.loads(payload)['source_commit']==source
                  for path,name in cases.items():
                      data,kind=get(path);assert 'text/html' in kind
                      assert hashlib.sha256(data).hexdigest()==expected[name],path
                      assert b'installPressFeedback' in data
                  print(json.dumps({'verified':True,'source_commit':source,'routes':[base+p for p in cases]},indent=2));break
              except Exception as exc:
                  last=str(exc);print('Waiting for Pages:',last,flush=True);time.sleep(8)
          else:raise RuntimeError(last)
          PY
