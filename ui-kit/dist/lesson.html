/* Reusable independent card UI — no dependency on TripFit's application CSS */
:root {
  --tk-ink: #0e2a3a;
  --tk-deep: #173a4c;
  --tk-paper: #f3f1ea;
  --tk-lemon: #d6f23b;
  --tk-rose: #ffcce5;
  --tk-blue: #8ec5ee;
  --tk-mint: #bdefdb;
  --tk-lilac: #cbbdff;
  --tk-peach: #f8d5bc;
  --tk-backdrop: #e7f1ec;
  --tk-font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", system-ui, sans-serif;
}
.tk-stage *, .tk-stage *::before, .tk-stage *::after { box-sizing: border-box; }
.tk-stage {
  background: var(--tk-backdrop);
  color: var(--tk-ink);
  font-family: var(--tk-font);
  min-height: 100dvh;
  padding: 24px;
  display: grid;
  place-items: center;
}
.tk-rig {
  width: 100%;
  max-width: 920px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 48px;
}
.tk-aside { flex: 1; max-width: 390px; }
.tk-kicker { font-size: 12px; font-weight: 700; letter-spacing: .14em; opacity: .65; }
.tk-aside-title {
  font-size: clamp(35px, 5vw, 56px);
  letter-spacing: -.06em;
  line-height: 1.1;
  margin: 18px 0;
}
.tk-aside-subtitle { font-size: 16px; line-height: 1.65; color: #425f69; }
.tk-progress { display: flex; gap: 5px; margin-top: 26px; }
.tk-dot {
  width: 16px; height: 6px; border-radius: 6px;
  background: #b1c2bb; transition: width .35s ease;
}
.tk-dot.is-active { width: 46px; background: var(--tk-ink); }
.tk-dot.is-done { background: #708f82; }
.tk-device {
  background: #101619;
  width: 410px; height: 850px;
  padding: 11px; border-radius: 58px;
  flex: none;
  box-shadow: 0 0 0 2px #777f89, 0 0 0 4px #afb8bf, 0 30px 80px #193d4b33;
}
.tk-screen {
  position: relative;
  width: 100%; height: 100%;
  background: var(--tk-ink);
  border-radius: 47px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.tk-status {
  display: flex; flex: none; justify-content: space-between; align-items: center;
  color: var(--tk-paper); padding: 35px 25px 16px;
  font-size: 11px; font-weight: 750; letter-spacing: .12em;
}
.tk-counter { opacity: .7; font-variant-numeric: tabular-nums; }
.tk-viewport { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.tk-page {
  position: absolute; inset: 0;
  overflow-y: auto; overflow-x: hidden;
  display: flex; flex-direction: column;
  gap: 4px; padding: 5px 5px 18px;
  scrollbar-width: none;
}
.tk-page::-webkit-scrollbar { display: none; }
.tk-eyebrow {
  color: #c1eccf; font-size: 11px; letter-spacing: .14em;
  padding: 3px 18px 10px; font-weight: 750;
}
.tk-card {
  --tk-surface: var(--tk-paper);
  flex: none;
  padding: 20px;
  border-radius: 29px;
  background: var(--tk-surface);
  color: var(--tk-ink);
  overflow-wrap: anywhere;
}
.tk-card.tk-hero { padding: 31px 22px 28px; border-radius: 37px; min-height: 188px; }
.tk-lime { --tk-surface: var(--tk-lemon); }
.tk-pink { --tk-surface: var(--tk-rose); }
.tk-sky { --tk-surface: var(--tk-blue); }
.tk-mint { --tk-surface: var(--tk-mint); }
.tk-cream { --tk-surface: var(--tk-paper); }
.tk-lilac { --tk-surface: var(--tk-lilac); }
.tk-peach { --tk-surface: var(--tk-peach); }
.tk-label { margin: 0 0 12px; font-size: 11px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; opacity: .75; }
.tk-title {
  margin: 0 0 8px;
  font-size: 24px; font-weight: 700; line-height: 1.23;
  letter-spacing: -.045em; white-space: pre-line;
}
.tk-hero .tk-title { font-size: 36px; }
.tk-body { margin: 0; font-size: 15px; line-height: 1.56; color: #34535c; }
.tk-metric { display: flex; gap: 10px; align-items: baseline; margin-top: 15px; }
.tk-value { font-weight: 600; font-size: 58px; letter-spacing: -.06em; font-variant-numeric: tabular-nums; }
.tk-unit { font-weight: 650; font-size: 15px; }
.tk-options { display: grid; gap: 9px; margin-top: 12px; }
.tk-option {
  width: 100%; min-height: 52px; cursor: pointer; text-align: left;
  padding: 12px 20px; border-radius: 999px; border: none;
  background: var(--tk-ink); color: white;
  font: 650 15px var(--tk-font);
  transition: filter .2s ease, transform .2s ease;
}
.tk-option:hover { filter: brightness(1.18); }
.tk-option:active { transform: scale(.98); }
.tk-clickable { cursor: pointer; transition: filter .2s ease, transform .2s ease; }
.tk-clickable:hover { filter: brightness(.97); }
.tk-clickable:active { transform: scale(.99); }
.tk-clickable:focus-visible, .tk-option:focus-visible, .tk-primary:focus-visible {
  outline: 3px solid #7b5cff; outline-offset: 3px;
}
.tk-footer { flex: none; padding: 13px 12px 26px; display: grid; gap: 9px; background: var(--tk-ink); }
.tk-footer:empty { display: none; }
.tk-primary {
  border: none; background: var(--tk-lemon); color: var(--tk-ink);
  border-radius: 999px; min-height: 60px;
  text-align: left; padding: 12px 23px;
  cursor: pointer; font: 750 16px var(--tk-font);
}
@media (max-width: 750px), (pointer: coarse) and (max-width: 900px) {
  .tk-stage { padding: 0; background: var(--tk-ink); }
  .tk-rig { width: 100vw; height: 100dvh; display: block; }
  .tk-aside { display: none; }
  .tk-device { width: 100%; height: 100%; padding: 0; border-radius: 0; box-shadow: none; }
  .tk-screen { border-radius: 0; }
  .tk-status { padding-top: calc(18px + env(safe-area-inset-top)); }
  .tk-footer { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
}
@media (prefers-reduced-motion: reduce) {
  .tk-stage *, .tk-stage *::before, .tk-stage *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}

</style>
<style data-kit-source="tripfit-details.css">
/*
 * Extracted/adapted visual details from TripFit's web/index.html:
 *   its original .cut/.tab/.flag/.pill and digit roller patterns.
 * Only intended for continued development inside this GitHub fork until
 * the upstream author's reuse permission is clarified.
 */
.tk-page .tk-card { position: relative; }
.tk-page .tk-card.tk-cut::after {
  content: "";
  position: absolute;
  bottom: 0; left: 50%;
  width: 104px; height: 14px; margin-left: -52px;
  background: var(--tk-ink);
  border-radius: 10px 10px 0 0;
}
.tk-page .tk-card.tk-cut.tk-right::after {
  left: auto; right: 40px; margin: 0;
}
.tk-page .tk-card.tk-cut.tk-left::after {
  left: 40px; margin: 0;
}
.tk-page .tk-card.tk-tab::before {
  content: "";
  position: absolute; z-index: 1;
  top: -14px; left: 50%;
  width: 96px; height: 18px; margin-left: -48px;
  background: var(--tk-surface);
  border-radius: 10px 10px 0 0;
}
.tk-page .tk-card.tk-tab.tk-right::before {
  left: auto; right: 44px; margin: 0;
}
.tk-page .tk-card.tk-tab.tk-left::before {
  left: 44px; margin: 0;
}
.tk-floating-flag {
  position: relative; z-index: 3;
  display: inline-flex; align-items: center;
  height: 35px; padding: 0 16px;
  margin: -11px 0 -12px 12px;
  background: var(--tk-ink);
  color: var(--tk-paper);
  border-radius: 999px;
  font-size: 12px; font-weight: 650;
  box-shadow: 0 0 0 4px var(--tk-ink);
  align-self: flex-start;
}
.tk-pill {
  display: inline-flex; align-items: center;
  padding: 0 13px; height: 30px; max-width: 100%;
  border: 1.5px solid var(--tk-ink);
  border-radius: 999px;
  font-size: 12px; font-weight: 650;
  margin-top: 12px;
}
.tk-title-word { display: inline-block; white-space: nowrap; }
.tk-title-char { display: inline-block; }
.tk-odometer { display: inline-flex; line-height: 1; white-space: nowrap; }
.tk-od-column { display: inline-block; overflow: hidden; height: 1em; width: .65em; }
.tk-od-stack { display: flex; flex-direction: column; transition: transform 700ms cubic-bezier(.34,1.4,.64,1); }
.tk-od-stack > span { height: 1em; min-height: 1em; line-height: 1em; text-align: center; }
.tk-od-static { display: inline-block; }
.tk-island {
  position: absolute; z-index: 90;
  top: 11px; left: 50%;
  transform: translateX(-50%);
  background: #050607; color: #fff;
  border-radius: 20px;
  width: 126px; height: 37px;
  padding: 0 15px;
  display: flex; align-items: center;
  justify-content: center;
  opacity: 0; visibility: hidden;
  overflow: hidden;
  transition: width 480ms cubic-bezier(.34,1.4,.64,1),
              height 480ms cubic-bezier(.34,1.4,.64,1),
              opacity 200ms, border-radius 480ms;
  pointer-events: none;
}
.tk-island.is-open {
  width: calc(100% - 24px); max-width: 370px;
  height: 66px; border-radius: 31px;
  opacity: 1; visibility: visible;
}
.tk-island-label {
  font: 650 13px/1.4 var(--tk-font);
  white-space: normal; overflow-wrap: anywhere;
  text-align: center;
}
@media (max-width: 750px), (pointer: coarse) and (max-width: 900px) {
  .tk-island { top: calc(7px + env(safe-area-inset-top)); }
  .tk-island.is-open { background: var(--tk-deep); }
}
@media (prefers-reduced-motion: reduce) {
  .tk-od-stack, .tk-island { transition: none !important; }
}

</style>
<style data-kit-source="presentation.css">
/* Fidelity layer for the extracted TripFit primitives, not a new visual theme.
   Geometry/color/motion follow the source project; data and layouts stay free. */
:root{--tk-grotesk:"Inter Tight","Helvetica Neue",Arial,var(--tk-font);--tk-violet:#7b5cff;--tk-red:#ff5b4a}
html,body{margin:0;height:100%;background:var(--tk-ink)}
.tk-stage{height:100dvh;min-height:0;padding:0;overflow:hidden;-webkit-font-smoothing:antialiased;word-break:keep-all}
.tk-rig{width:auto;max-width:none;gap:44px;transform-origin:center;flex:none}
.tk-aside{width:330px;flex:none}
.tk-aside-title{font-size:52px;font-weight:500;line-height:1.08}
.tk-aside-subtitle{font-weight:400;line-height:1.6}
.tk-device{width:417px;height:876px;padding:12px;border-radius:68px;background:#0a0d10;box-shadow:0 0 0 1.5px #4d5560,0 0 0 3.5px #9aa2ac,0 0 0 5px #39404a,0 50px 90px -40px #0e2a3a80}
.tk-screen{width:393px;height:852px;border-radius:56px;isolation:isolate;display:block}
.tk-screen:after{content:'';position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:19px;background:#000;pointer-events:none;z-index:60}
.tk-status{position:absolute;inset:0 0 auto;height:54px;padding:6px 34px 0 35px;color:var(--tk-ink);z-index:40;pointer-events:none;font-size:12px;letter-spacing:0;font-weight:600}
.tk-viewport{position:absolute;inset:0}
.tk-page{display:flex;gap:4px;padding:4px 4px 150px;overscroll-behavior:contain}
.tk-card{position:relative;padding:18px 20px;border-radius:30px;overflow-wrap:normal;min-width:0}
.tk-card.tk-top{border-radius:52px 52px 30px 30px;padding-top:62px}
.tk-title{font-size:25px;font-weight:600;line-height:1.24;letter-spacing:-.045em;margin:10px 0 0;white-space:pre-line}
.tk-balance-title{font-size:21px;min-height:2.5em}
.tk-body{font-size:15px;color:var(--tk-ink);line-height:1.6;font-weight:500;white-space:pre-line}
.tk-label{font-size:11px;letter-spacing:.09em;font-weight:600;margin:0;opacity:.8}
.tk-lab{font-size:12.5px;font-weight:500;opacity:.8}
.tk-pill{font-size:12px;height:28px;font-weight:600;padding:0 10px;margin:0;gap:6px;white-space:nowrap}
.tk-pill.tk-filled{background:var(--tk-ink);color:var(--tk-paper)}
.tk-row{display:flex;align-items:center;gap:12px;min-width:0}
.tk-between{justify-content:space-between}
.tk-pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;margin-top:18px}
.tk-readout{display:inline-flex;align-items:baseline;gap:2px;font-family:var(--tk-grotesk);white-space:nowrap;line-height:1}
.tk-value{display:inline-flex;font-family:var(--tk-grotesk);font-size:34px;font-weight:500;line-height:1;letter-spacing:-.045em}
.tk-readout em{font-size:14px;font-style:normal;letter-spacing:0;font-weight:500}
.tk-large .tk-value{font-size:92px;line-height:.86;letter-spacing:-.06em}
.tk-large em{font-size:22px;margin-left:3px}
.tk-pair>.tk-readout:last-child{justify-content:flex-end}
.tk-colon{font:500 64px/.86 var(--tk-grotesk);padding:0 4px 6px}
.tk-od-column{width:auto;min-width:0}
.tk-od-stack{transition:transform var(--tk-spring-ms,700ms) var(--tk-spring,cubic-bezier(.34,1.4,.64,1))}
.tk-od-stack>span{min-height:1em;letter-spacing:inherit}
.tk-pair-labels{display:flex;justify-content:space-between;margin-top:12px;font-size:12.5px;font-weight:600}
.tk-dot-person{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--person);box-shadow:0 0 0 1.5px var(--tk-ink);margin:0 6px 0 0}
.tk-balance-note{display:flex;flex-wrap:wrap;gap:5px 10px;font-size:11px;margin-top:12px;line-height:1.5}
.tk-slider{margin-top:16px}
.tk-slider-track{position:relative;height:46px;margin:0 10px}
.tk-slider-track:before{content:'';height:2px;position:absolute;left:0;right:0;top:22px;background:var(--tk-ink)}

.tk-chart-card{padding:0;overflow:visible}

.tk-row-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px}

.tk-row-card p{font-size:12.5px;line-height:1.5;margin:4px 0 0;opacity:.8}
.tk-row-card .tk-value{font-size:30px}
.tk-ico{display:grid;place-items:center;flex:none;width:46px;height:46px;border-radius:50%;background:var(--tk-ink);color:var(--tk-lemon)}
.tk-stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:20px}

.tk-footer{position:absolute;bottom:0;left:0;right:0;padding:20px 10px 28px;z-index:20;background:linear-gradient(to top,var(--tk-ink) 60%,#0e2a3a00);display:grid;gap:8px}
.tk-primary,.tk-secondary{width:100%;height:64px;min-height:64px;border-radius:99px;border:0;background:var(--tk-lemon);color:var(--tk-ink);font:600 17px var(--tk-font);letter-spacing:-.03em;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 28px;cursor:pointer}

.tk-secondary{background:var(--tk-ink);color:var(--tk-paper);margin-top:12px}

      {type:'text',render:app=>rowCard({tone:'pink',title:'힌트가 필요하다면',subtitle:'괄호 안의 식을 0으로 만들어 보세요',symbol:'spark',onClick:()=>showConcept(app,d),id:'hint-card'})}
    ],actions:[{label:'풀이와 결과 보기',next:'result'}]},
    {id:'result',label:'문제 풀이와 결과',cards:[
      {type:'text',render:app=>card({tone:'lime',join:'cut',className:'tk-top'},node('span',{class:'tk-label'},'03 / 학습 확인'),node('h1',{class:'tk-title'},app.state.answer===d.answer?'개념이 문제로,\n연결됐어요.':'한 번 더 보면,\n분명해져요.'),node('div',{style:'margin-top:22px'},metric(app.state.answer===d.answer?'100':'0','%',{large:true,id:'result-score'})),node('p',{class:'tk-body',style:'margin-top:14px'},'이번 확인 문제 · 선택 결과'))},
      {type:'text',render:()=>card({tone:'cream',join:'tab cut',side:'left',title:'정답은 (2, −1)'},node('p',{class:'tk-formula'},'p = 2, q = −1'),node('p',{class:'tk-body'},d.explanation))},
      {type:'text',render:app=>card({tone:'sky',join:'tab',side:'left',title:'이제 직접 설명해 보세요.'},node('p',{class:'tk-body'},'왜 x 좌표는 −2가 아니라 2일까요?\n왜 y 좌표는 −1일까요?'),button('다시 풀어보기',()=>{app.state.answer=null;app.go('quiz');},{secondary:true,id:'retry-question'}))},
      {type:'text',render:app=>rowCard({tone:'lilac',title:'이 예시는 어떻게 만들었나요?',subtitle:'원본이 아닌 키트 기반 재생성',symbol:'code',onClick:()=>showKit(app),id:'kit-proof'})}
    ],actions:[{label:'학습 화면으로 돌아가기',next:'learn'}]}
  ]
};}
function startLesson(mount=document.getElementById('app'),data=lesson){const app=new ComposedFlow(mount,createLessonFlow(data)).mount();window.__kitDemo=app;return app;}
if(typeof document!=='undefined'&&document.getElementById('app'))startLesson();

return {createLessonFlow,startLesson};})();
window.__kitModules=modules;})();
